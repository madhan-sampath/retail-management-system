<div class="sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-header">
    <h4 class="sidebar-title">Retail Management</h4>
    <button class="btn btn-sm btn-outline-light" (click)="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>
  </div>
  
  <nav class="sidebar-nav">
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
          <i class="fas fa-tachometer-alt me-2"></i>
          <span class="nav-text">Dashboard</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/products" routerLinkActive="active">
          <i class="fas fa-boxes me-2"></i>
          <span class="nav-text">Products</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/orders" routerLinkActive="active">
          <i class="fas fa-shopping-cart me-2"></i>
          <span class="nav-text">Orders</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/customers" routerLinkActive="active">
          <i class="fas fa-users me-2"></i>
          <span class="nav-text">Customers</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/reports" routerLinkActive="active">
          <i class="fas fa-chart-bar me-2"></i>
          <span class="nav-text">Reports</span>
        </a>
      </li>
    </ul>
  </nav>
</div>
